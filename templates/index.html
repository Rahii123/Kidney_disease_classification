<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kidney Guard AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --secondary: #06B6D4;
            --bg: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #F1F5F9;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1E1B4B, #0F172A);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            width: 90%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px rgba(255, 255, 255, 0.1) solid;
            text-align: center;
            transition: transform 0.3s ease;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #818CF8, #22D3EE);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p {
            color: #94A3B8;
            font-weight: 300;
            margin-bottom: 2rem;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            padding: 2rem;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--secondary);
            background: rgba(255, 255, 255, 0.05);
        }

        #imagePreview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            display: none;
            margin-top: 1rem;
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 2rem;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 2.5rem;
            padding: 1.5rem;
            border-radius: 16px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .prediction-text {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .confidence-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .confidence-progress {
            height: 100%;
            background: var(--secondary);
            transition: width 1s ease;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Kidney Guard AI</h1>
    <p>Advanced Deep Learning for CT Scan Analysis</p>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <span id="uploadLabel">Click to upload CT Scan Image</span>
        <input type="file" id="fileInput" hidden accept="image/*" onchange="previewImage(event)">
        <img id="imagePreview" alt="Preview">
    </div>

    <button onclick="predict()">
        <span id="btnText">Analyze Now</span>
        <div id="btnSpinner" class="spinner"></div>
    </button>

    <div id="result">
        <div class="prediction-text" id="labelOutput"></div>
        <div id="confidenceOutput">Confidence: 0%</div>
        <div class="confidence-bar">
            <div class="confidence-progress" id="progressOutput" style="width: 0%"></div>
        </div>
    </div>
</div>

<script>
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const output = document.getElementById('imagePreview');
            output.src = reader.result;
            output.style.display = 'block';
            document.getElementById('uploadLabel').style.display = 'none';
        }
        reader.readAsDataURL(event.target.files[0]);
    }

    async function predict() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) {
            alert('Please select an image first.');
            return;
        }

        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const resultDiv = document.getElementById('result');

        btnText.style.display = 'none';
        btnSpinner.style.display = 'block';
        resultDiv.style.display = 'none';

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const response = await fetch('/predict/', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.status === 'success') {
                const label = data.predicted_label;
                const conf = data.confidence;

                document.getElementById('labelOutput').innerText = label;
                document.getElementById('labelOutput').style.color = label === 'Normal' ? '#4ADE80' : '#F87171';
                document.getElementById('confidenceOutput').innerText = `Confidence: ${conf}%`;
                document.getElementById('progressOutput').style.width = `${conf}%`;
                document.getElementById('progressOutput').style.backgroundColor = label === 'Normal' ? '#4ADE80' : '#F87171';
                
                resultDiv.style.display = 'block';
            } else {
                alert('Analysis failed.');
            }
        } catch (error) {
            console.error(error);
            alert('Error connecting to the server.');
        } finally {
            btnText.style.display = 'block';
            btnSpinner.style.display = 'none';
        }
    }
</script>

</body>
</html>
